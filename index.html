<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCG La Band'à joe</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="cards_data.js"></script>
    <style>
        /* --- VARIABLES & THÈME TELEGRAM --- */
        :root {
            --bg-color: var(--tg-theme-bg-color, #111720);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #788796);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #1a232f);
            
            /* Couleurs de rareté officielles */
            --color-common: #95a5b5;
            --color-rare: #0094ff;
            --color-epic: #a335ee;
            --color-legendary: #ffaa00;

            /* Halos d'ambiance projetés derrière la carte */
            --halo-common: rgba(149, 165, 181, 0.45);
            --halo-rare: rgba(0, 148, 255, 0.7);
            --halo-epic: rgba(163, 53, 238, 0.8);
            --halo-legendary: rgba(255, 170, 0, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVIGATION --- */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
            display: none;
        }
        .tab-content.active { display: block; }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background-color: var(--secondary-bg);
            display: flex;
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--hint-color);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            gap: 4px;
        }
        .nav-item.active { color: var(--button-color); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

        /* --- SECTION BOOSTER --- */
        .shop-header { text-align: center; margin: 15px 0 25px; }
        .shop-header h2 { font-size: 24px; font-weight: 800; }
        
        .energy-box {
            background: var(--secondary-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .energy-count { font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px; }
        .timer { color: var(--hint-color); font-size: 13px; font-weight: 500; }
        
        .pack-btn {
            background: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 14px rgba(36, 129, 204, 0.4);
            transition: transform 0.1s;
        }
        .pack-btn:active { transform: scale(0.98); }
        .pack-btn:disabled { background: #333e4d; color: #6d7b8b; cursor: not-allowed; box-shadow: none; }

        /* --- OUTILS DEV --- */
        .dev-panel {
            margin-top: 35px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.15);
            text-align: center;
        }
        .dev-title { font-size: 11px; text-transform: uppercase; color: var(--hint-color); letter-spacing: 1px; margin-bottom: 10px; font-weight: 700; }
        .dev-btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .dev-btn {
            background: var(--secondary-bg);
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .dev-btn:active { background: rgba(255,255,255,0.1); }

        /* --- MA COLLECTION --- */
        .progress-bar-container {
            background: var(--secondary-bg);
            border-radius: 10px;
            height: 22px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #2481cc, #54a9eb);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        .progress-text {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding-bottom: 20px;
        }

        .empty-collection {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--hint-color);
            font-size: 14px;
            line-height: 1.6;
        }
        .empty-collection span { font-size: 40px; display: block; margin-bottom: 12px; }

        /* Carte dans la collection : pas de bordure interne pour préserver les bords */
        .card-frame {
            aspect-ratio: 630 / 880;
            border-radius: 10px;
            position: relative;
            background: var(--secondary-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        .card-frame:active { transform: scale(0.96); }

        /* Raretés en collection (halo externe sans border couvrante) */
        .rarity-common { box-shadow: 0 0 10px var(--halo-common); }
        .rarity-rare { box-shadow: 0 0 14px var(--halo-rare); }
        .rarity-epic { box-shadow: 0 0 16px var(--halo-epic); }
        .rarity-legendary { box-shadow: 0 0 20px var(--halo-legendary); }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 80%);
            padding: 8px;
            text-align: center;
        }
        .card-fallback-emoji { font-size: 34px; margin-bottom: 6px; }
        .card-fallback-name { font-size: 10px; font-weight: 700; line-height: 1.2; }

        /* --- ÉCRAN D'OUVERTURE DE BOOSTER --- */
        #opening-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1b2636 0%, #0d1219 100%);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reveal-header {
            position: absolute;
            top: 40px;
            font-size: 16px;
            font-weight: 800;
            color: var(--hint-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .card-stage-container {
            position: relative;
            width: min(280px, 75vw);
            aspect-ratio: 630 / 880;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Halo arrière-plan diffus (ne recouvre aucun pixel de la carte) */
        .card-stage-halo {
            position: absolute;
            inset: -25px;
            border-radius: 35px;
            filter: blur(40px);
            opacity: 0;
            transition: opacity 0.4s ease, background 0.3s ease;
            pointer-events: none;
            z-index: 1;
        }
        .card-stage-halo.active { opacity: 1; }

        .card-stage {
            width: 100%;
            height: 100%;
            perspective: 1200px;
            position: relative;
            z-index: 2;
            cursor: pointer;
        }

        .card-3d-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .slide-in-right {
            animation: slideInRight 0.35s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }
        .slide-out-left {
            animation: slideOutLeft 0.3s cubic-bezier(0.8, 0, 0.9, 0.2) forwards;
        }

        @keyframes slideInRight {
            0% { transform: translateX(130%) scale(0.85); opacity: 0; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }
        @keyframes slideOutLeft {
            0% { transform: translateX(0) rotateY(180deg) scale(1); opacity: 1; }
            100% { transform: translateX(-130%) rotateY(180deg) scale(0.8); opacity: 0; }
        }

        .card-3d-wrapper.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }

        /* Dos de la carte */
        .card-face.back {
            background: linear-gradient(135deg, #18283b, #0e1722);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #2d4563;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .back-pattern {
            width: 84%;
            height: 89%;
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .back-pattern svg { width: 50px; height: 50px; fill: #2481cc; opacity: 0.8; }
        .back-pattern span { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: #4e7399; text-transform: uppercase; }

        /* Face avant : bordure supprimée pour préserver 100% des bords de l'image */
        .card-face.front {
            transform: rotateY(180deg);
            background: var(--secondary-bg);
            display: flex;
            flex-direction: column;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .tap-hint {
            position: absolute;
            bottom: -45px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: var(--text-color);
            font-weight: 700;
            animation: pulseHint 1.4s infinite ease-in-out;
            pointer-events: none;
            z-index: 3;
        }
        @keyframes pulseHint { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* --- MODAL DÉTAILS DE LA CARTE --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--secondary-bg);
            border-radius: 20px;
            width: 100%;
            max-width: 310px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            transform: translateY(20px);
            transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-card-stage {
            width: 180px;
            aspect-ratio: 630 / 880;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: none;
            background: var(--bg-color);
            transition: box-shadow 0.3s ease;
        }

        .modal-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; text-align: center; }
        .modal-rarity { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
        .modal-badge-count {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 22px;
        }
        .modal-close-btn {
            background: rgba(255,255,255,0.1);
            color: var(--text-color);
            border: none;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .modal-close-btn:active { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>

    <!-- ONGLET 1 : BOOSTER -->
    <div id="tab-shop" class="tab-content active">
        <div class="shop-header">
            <h2>TCG La Band'à joe</h2>
            <p style="color: var(--hint-color); font-size: 14px; margin-top: 4px;">Ouvre des boosters et agrandis ta collection</p>
        </div>

        <div class="energy-box">
            <div class="energy-count">Boosters : <span id="pack-count">0</span> / 6</div>
            <div class="timer" id="timer-display">Calcul...</div>
        </div>

        <button class="pack-btn" id="open-pack-btn" onclick="startPackOpening()">
            Ouvrir 1 Booster (3 cartes)
        </button>

        <!-- OUTILS DEV -->
        <div class="dev-panel">
            <div class="dev-title">🛠️ Outils Dev (Test Rapide)</div>
            <div class="dev-btn-group">
                <button class="dev-btn" onclick="devResetTimer()">⚡ Booster Max (6/6)</button>
                <button class="dev-btn" onclick="devAddPack()">➕ +1 Booster</button>
                <button class="dev-btn" onclick="devUnlockAllCards()">🃏 Toutes les cartes</button>
                <button class="dev-btn" onclick="devClearSave()" style="color: #ff6b6b;">🗑️ Reset Data</button>
            </div>
        </div>
    </div>

    <!-- ONGLET 2 : MA COLLECTION -->
    <div id="tab-collection" class="tab-content">
        <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 12px;">Ma Collection</h2>
        
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
            <div class="progress-text" id="progress-text">0 / 0 cartes</div>
        </div>

        <div class="collection-grid" id="collection-grid">
            <!-- Rempli par JavaScript -->
        </div>
    </div>

    <!-- NAVIGATION DU BAS -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('shop')" id="nav-shop">
            <svg viewBox="0 0 24 24">
                <path d="M4 6C4 4.89543 4.89543 4 6 4H18C19.1046 4 20 4.89543 20 6V9H4V6Z"/>
                <path d="M4 11H9V13C9 13.5523 9.44772 14 10 14H14C14.5523 14 15 13.5523 15 13V11H20V18C20 19.1046 19.1046 20 18 20H6C4.89543 20 4 19.1046 4 18V11Z"/>
                <rect x="11" y="11" width="2" height="2" rx="0.5" fill="var(--secondary-bg)"/>
            </svg>
            Booster
        </div>
        <div class="nav-item" onclick="switchTab('collection')" id="nav-collection">
            <svg viewBox="0 0 24 24">
                <path d="M4 4C4 2.89543 4.89543 2 6 2H18C19.1046 2 20 2.89543 20 4V20C20 21.1046 19.1046 22 18 22H6C4.89543 22 4 21.1046 4 20V4Z"/>
                <path d="M7 6H17M7 10H17M7 14H13" stroke="var(--secondary-bg)" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Collection
        </div>
    </div>

    <!-- ÉCRAN D'OUVERTURE DE BOOSTER -->
    <div id="opening-screen">
        <div class="reveal-header">Carte <span id="reveal-current">1</span> / 3</div>

        <div class="card-stage-container">
            <div class="card-stage-halo" id="card-halo"></div>

            <div class="card-stage" onclick="handleCardClick()">
                <div class="card-3d-wrapper" id="card-3d">
                    
                    <!-- DOS -->
                    <div class="card-face back">
                        <div class="back-pattern">
                            <svg viewBox="0 0 24 24">
                                <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/>
                            </svg>
                            <span>TCG</span>
                        </div>
                    </div>

                    <!-- FACE AVANT -->
                    <div class="card-face front" id="reveal-card-front"></div>

                </div>
            </div>
            <div class="tap-hint" id="tap-hint">Touche la carte pour révéler</div>
        </div>
    </div>

    <!-- MODAL DÉTAILS DE LA CARTE -->
    <div class="modal-overlay" id="card-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-card-stage" id="modal-card-stage"></div>
            <div class="modal-name" id="modal-card-name">Nom</div>
            <div class="modal-rarity" id="modal-card-rarity">Rareté</div>
            <div class="modal-badge-count">Exemplaires possédés : <strong id="modal-card-count" style="color: var(--button-color); margin-left: 4px;">x0</strong></div>
            <button class="modal-close-btn" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script>
        // --- 1. INITIALISATION TELEGRAM ---
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // --- 2. CALCUL DYNAMIQUE VIA CARDS_DATA.JS ---
        const TOTAL_CARDS = typeof CARDS_DB !== 'undefined' 
            ? Object.values(CARDS_DB).reduce((sum, list) => sum + list.length, 0) 
            : 0;

        // --- 3. SAUVEGARDE VIA CLOUDSTORAGE ---
        // 1 Booster toutes les 10 minutes, 6 boosters au maximum
        const PACK_REGEN_TIME = 10 * 60 * 1000;
        const MAX_PACKS = 6;

        let state = {
            packs: MAX_PACKS,
            lastUpdate: Date.now(),
            inventory: {}
        };

        function saveState() {
            const data = JSON.stringify(state);
            if (tg?.CloudStorage) {
                tg.CloudStorage.setItem('tma_gacha_v1', data);
            } else {
                localStorage.setItem('tma_gacha_v1', data);
            }
        }

        function loadState(callback) {
            if (tg?.CloudStorage) {
                tg.CloudStorage.getItem('tma_gacha_v1', (err, value) => {
                    if (!err && value) {
                        try { state = JSON.parse(value); } catch(e){}
                    }
                    callback();
                });
            } else {
                const local = localStorage.getItem('tma_gacha_v1');
                if (local) {
                    try { state = JSON.parse(local); } catch(e){}
                }
                callback();
            }
        }

        // --- 4. ÉNERGIE & TIMER ---
        function updateEnergy() {
            const now = Date.now();
            if (state.packs < MAX_PACKS) {
                const elapsed = now - state.lastUpdate;
                const earned = Math.floor(elapsed / PACK_REGEN_TIME);
                if (earned > 0) {
                    state.packs = Math.min(MAX_PACKS, state.packs + earned);
                    state.lastUpdate += earned * PACK_REGEN_TIME;
                    saveState();
                }
            } else {
                state.lastUpdate = now;
            }
            renderEnergyUI();
        }

        function renderEnergyUI() {
            document.getElementById('pack-count').innerText = state.packs;
            const openBtn = document.getElementById('open-pack-btn');

            if (state.packs >= MAX_PACKS) {
                document.getElementById('timer-display').innerText = "Booster max atteint (6/6)";
            } else {
                const remaining = PACK_REGEN_TIME - (Date.now() - state.lastUpdate);
                const m = Math.floor(remaining / 60000);
                const s = Math.floor((remaining % 60000) / 1000);
                document.getElementById('timer-display').innerText = `Prochain booster dans ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            openBtn.disabled = state.packs <= 0;
            openBtn.innerText = state.packs > 0 ? "Ouvrir 1 Booster (3 cartes)" : "Recharge en cours...";
        }

        // --- OUTILS DEV ---
        function devResetTimer() {
            state.packs = MAX_PACKS;
            state.lastUpdate = Date.now();
            saveState();
            renderEnergyUI();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function devAddPack() {
            state.packs = Math.min(MAX_PACKS, state.packs + 1);
            saveState();
            renderEnergyUI();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function devUnlockAllCards() {
            if (typeof CARDS_DB === 'undefined') return;
            const allCards = [
                ...CARDS_DB.common,
                ...CARDS_DB.rare,
                ...CARDS_DB.epic,
                ...CARDS_DB.legendary
            ];
            allCards.forEach(card => {
                state.inventory[card.id] = (state.inventory[card.id] || 0) + 1;
            });
            saveState();
            renderCollection();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function devClearSave() {
            if (confirm("Réinitialiser l'inventaire et les boosters ?")) {
                state = { packs: MAX_PACKS, lastUpdate: Date.now(), inventory: {} };
                saveState();
                renderEnergyUI();
                renderCollection();
            }
        }

        // --- 5. TIRAGE ALÉATOIRE ---
        function drawOneCard() {
            const roll = Math.random() * 100;
            let rarity = 'common';
            if (roll > 70 && roll <= 90) rarity = 'rare';       // 20%
            else if (roll > 90 && roll <= 99) rarity = 'epic';   // 9%
            else if (roll > 99) rarity = 'legendary';            // 1%

            const pool = CARDS_DB[rarity];
            const card = pool[Math.floor(Math.random() * pool.length)];
            return { ...card, rarity };
        }

        // --- 6. OUVERTURE DE BOOSTER ---
        let currentPack = [];
        let cardStep = 0;
        let isCardFlipped = false;
        let canProceed = false;

        function startPackOpening() {
            if (state.packs <= 0) return;

            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            state.packs--;
            if (state.packs === MAX_PACKS - 1) state.lastUpdate = Date.now();
            saveState();
            renderEnergyUI();

            currentPack = [drawOneCard(), drawOneCard(), drawOneCard()];
            cardStep = 0;

            document.getElementById('opening-screen').style.display = 'flex';
            loadCardIntoStage(false);
        }

        function loadCardIntoStage(withSlideAnimation = true) {
            isCardFlipped = false;
            canProceed = false;

            const cardWrapper = document.getElementById('card-3d');
            const frontFace = document.getElementById('reveal-card-front');
            const tapHint = document.getElementById('tap-hint');
            const halo = document.getElementById('card-halo');

            halo.className = 'card-stage-halo';
            halo.style.background = 'transparent';

            document.getElementById('reveal-current').innerText = cardStep + 1;
            tapHint.innerText = "Touche la carte pour révéler";

            cardWrapper.className = 'card-3d-wrapper';

            const card = currentPack[cardStep];
            frontFace.className = 'card-face front';
            frontFace.innerHTML = generateCardHTML(card);

            if (withSlideAnimation) {
                cardWrapper.classList.add('slide-in-right');
                setTimeout(() => cardWrapper.classList.remove('slide-in-right'), 350);
            }
        }

        function handleCardClick() {
            if (!isCardFlipped) {
                revealCurrentCard();
            } else if (canProceed) {
                advanceToNextCard();
            }
        }

        function revealCurrentCard() {
            isCardFlipped = true;
            const cardWrapper = document.getElementById('card-3d');
            const tapHint = document.getElementById('tap-hint');
            const halo = document.getElementById('card-halo');
            const card = currentPack[cardStep];

            if (tg?.HapticFeedback) {
                if (card.rarity === 'legendary') tg.HapticFeedback.notificationOccurred('success');
                else tg.HapticFeedback.impactOccurred('heavy');
            }

            cardWrapper.classList.add('flipped');

            // Halo arrière-plan diffus sans empiéter sur l'illustration
            halo.style.background = `var(--halo-${card.rarity})`;
            halo.classList.add('active');

            state.inventory[card.id] = (state.inventory[card.id] || 0) + 1;
            saveState();

            setTimeout(() => {
                canProceed = true;
                tapHint.innerText = cardStep === 2 ? "Touche pour terminer" : "Touche la carte pour continuer";
            }, 450);
        }

        function advanceToNextCard() {
            canProceed = false;
            const halo = document.getElementById('card-halo');

            if (cardStep < 2) {
                const cardWrapper = document.getElementById('card-3d');
                halo.classList.remove('active');
                cardWrapper.classList.add('slide-out-left');

                setTimeout(() => {
                    cardStep++;
                    loadCardIntoStage(true);
                }, 280);
            } else {
                halo.classList.remove('active');
                document.getElementById('opening-screen').style.display = 'none';
                renderEnergyUI();
                
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
        }

        // --- 7. GÉNÉRATEUR VISUEL DE CARTE ---
        function generateCardHTML(card) {
            if (card.image && card.image.trim() !== '') {
                return `<img class="card-image" src="${card.image}" alt="${card.name}" loading="lazy" />`;
            }
            return `
                <div class="card-fallback">
                    <div class="card-fallback-emoji">${card.emoji}</div>
                    <div class="card-fallback-name">${card.name}</div>
                </div>
            `;
        }

        // --- 8. COLLECTION ---
        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';

            if (typeof CARDS_DB === 'undefined') return;

            const allCards = [
                ...CARDS_DB.common.map(c => ({ ...c, rarity: 'common' })),
                ...CARDS_DB.rare.map(c => ({ ...c, rarity: 'rare' })),
                ...CARDS_DB.epic.map(c => ({ ...c, rarity: 'epic' })),
                ...CARDS_DB.legendary.map(c => ({ ...c, rarity: 'legendary' }))
            ];

            const ownedCards = allCards.filter(card => (state.inventory[card.id] || 0) > 0);

            if (ownedCards.length === 0) {
                grid.innerHTML = `
                    <div class="empty-collection">
                        <span>📦</span>
                        Tu n'as encore aucune carte.<br>Ouvre ton premier booster !
                    </div>
                `;
            } else {
                ownedCards.forEach(card => {
                    const count = state.inventory[card.id];

                    const cardEl = document.createElement('div');
                    cardEl.className = `card-frame rarity-${card.rarity}`;
                    cardEl.innerHTML = generateCardHTML(card);
                    cardEl.onclick = () => openModal(card, count);

                    grid.appendChild(cardEl);
                });
            }

            const pct = TOTAL_CARDS > 0 ? (ownedCards.length / TOTAL_CARDS) * 100 : 0;
            document.getElementById('progress-fill').style.width = pct + '%';
            document.getElementById('progress-text').innerText = `${ownedCards.length} / ${TOTAL_CARDS} cartes découvertes`;
        }

        // --- 9. MODAL DÉTAILS ---
        function openModal(card, count) {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            const stage = document.getElementById('modal-card-stage');
            stage.className = 'modal-card-stage';
            stage.style.boxShadow = `0 0 35px var(--halo-${card.rarity})`;
            stage.innerHTML = generateCardHTML(card);

            document.getElementById('modal-card-name').innerText = card.name;

            const rarityEl = document.getElementById('modal-card-rarity');
            rarityEl.innerText = card.rarity;
            rarityEl.style.color = `var(--color-${card.rarity})`;

            document.getElementById('modal-card-count').innerText = `x${count}`;
            document.getElementById('card-modal').classList.add('active');
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('card-modal')) return;
            document.getElementById('card-modal').classList.remove('active');
        }

        // --- 10. NAVIGATION ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');

            if (tabId === 'collection') renderCollection();
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        // --- 11. DÉMARRAGE ---
        loadState(() => {
            renderEnergyUI();
            renderCollection();
            setInterval(updateEnergy, 1000);
        });
    </script>
</body>
</html>
